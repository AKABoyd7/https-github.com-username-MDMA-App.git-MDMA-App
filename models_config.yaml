# Local LLM Models (GGUF - G:\Models_Organized)
local_models:
  # Code Generation Models
  deepseek-coder-local:
    path: G:\Models_Organized\lmstudio-community\deepseek-coder
    engine: gguf
    model_type: gguf
    use_case: [code, technical, debugging, completion]
    max_tokens: 8192
    temperature: 0.2
    context_length: 16384

  qwen2.5-coder-local:
    path: G:\Models_Organized\lmstudio-community\qwen2.5-coder
    engine: gguf
    model_type: gguf
    use_case: [code, technical, advanced_coding]
    max_tokens: 8192
    temperature: 0.2
    context_length: 32768

  qwen3-coder-local:
    path: G:\Models_Organized\lmstudio-community\qwen3-coder
    engine: gguf
    model_type: gguf
    use_case: [code, technical, advanced_coding, latest]
    max_tokens: 8192
    temperature: 0.2
    context_length: 32768

  codestral-local:
    path: G:\Models_Organized\lmstudio-community\codestral
    engine: gguf
    model_type: gguf
    use_case: [code, completion, fast_coding]
    max_tokens: 8192
    temperature: 0.2
    context_length: 32768

  # General Purpose Models
  llama3.1-local:
    path: G:\Models_Organized\lmstudio-community\llama3.1
    engine: gguf
    model_type: gguf
    use_case: [reasoning, general, business, chat]
    max_tokens: 8192
    temperature: 0.7
    context_length: 131072

  llama3.2-local:
    path: G:\Models_Organized\lmstudio-community\llama3.2
    engine: gguf
    model_type: gguf
    use_case: [reasoning, general, business, chat, latest]
    max_tokens: 8192
    temperature: 0.7
    context_length: 131072

  # Fast Inference Models
  mistral-local:
    path: G:\Models_Organized\lmstudio-community\mistral
    engine: gguf
    model_type: gguf
    use_case: [fast, lightweight, general]
    max_tokens: 8192
    temperature: 0.7
    context_length: 32768

  mistral-nemo-local:
    path: G:\Models_Organized\lmstudio-community\Mistral-Nemo-Instruct-2407-GGUF
    engine: gguf
    model_type: gguf
    use_case: [fast, lightweight, instruction_following]
    max_tokens: 8192
    temperature: 0.7
    context_length: 128000

  # Advanced Models
  nemotron-local:
    path: G:\Models_Organized\lmstudio-community\nemotron
    engine: gguf
    model_type: gguf
    use_case: [reasoning, advanced, research]
    max_tokens: 8192
    temperature: 0.7
    context_length: 32768

  wizardlm2-local:
    path: G:\Models_Organized\lmstudio-community\wizardlm2
    engine: gguf
    model_type: gguf
    use_case: [reasoning, complex_tasks, instruction]
    max_tokens: 8192
    temperature: 0.7
    context_length: 32768

  # Flagship Models - Latest & Greatest!
  qwen3-next-80b-local:
    path: G:\Models_Organized\lmstudio-community\Qwen3-Next-80B-A3B-Instruct
    engine: gguf
    model_type: gguf
    use_case: [advanced_reasoning, code, research, flagship, everything]
    max_tokens: 16384
    temperature: 0.7
    context_length: 32768
    notes: "Flagship model - most powerful local model available"

  llama-3.3-nemotron-70b-local:
    path: G:\Models_Organized\lmstudio-community\llama-3.3-nemotron
    engine: gguf
    model_type: gguf
    use_case: [advanced_reasoning, research, nvidia_optimized, flagship]
    max_tokens: 16384
    temperature: 0.7
    context_length: 131072
    notes: "Meta Llama 3.3 70B + NVIDIA Nemotron - Latest hybrid flagship with 128K context!"

# Cloud Models (NVIDIA)
cloud_models:
  llama-3.1-70B-cloud:
    engine: nvidia-cloud
    endpoint: https://integrate.api.nvidia.com/v1
    model_name: meta/llama-3.1-70b-instruct
    api_key_env: NVIDIA_API_KEY
    use_case: [advanced_reasoning, business, analytics, rag]
    max_tokens: 8192
    temperature: 0.7

  llama-3.1-8B-cloud:
    engine: nvidia-cloud
    endpoint: https://integrate.api.nvidia.com/v1
    model_name: meta/llama-3.1-8b-instruct
    api_key_env: NVIDIA_API_KEY
    use_case: [reasoning, business, fast]
    max_tokens: 8192
    temperature: 0.7

# Multimodal Models
multimodal_models:
  nv-clip:
    engine: nvidia-cloud
    endpoint: https://integrate.api.nvidia.com/v1
    model_name: nvidia/nv-clip-vit-h-14
    api_key_env: NVIDIA_API_KEY
    use_case: [vision, embedding, image_search, ocr_enhancement]
    modality: [image, text]

  clip-local:
    engine: local
    model_name: openai/clip-vit-large-patch14
    use_case: [vision, embedding]
    modality: [image, text]

# Voice Models
voice_models:
  whisper:
    engine: local
    model_name: openai/whisper-large-v3
    use_case: [stt, transcription]
    language: [en, th, multi]

  piper-tts:
    engine: local
    model_name: rhasspy/piper
    voice: en_US-lessac-medium
    use_case: [tts, voice_output]

# OCR Models
ocr_models:
  paddleocr:
    engine: local
    use_case: [ocr, text_extraction]
    language: [en, th, ch]

  tesseract:
    engine: local
    use_case: [ocr, document_processing]
    language: [eng, tha]

# Routing Rules (Local-first with Cloud fallback)
routing:
  code:
    - qwen3-next-80b-local       # 🏆 Flagship 80B model (best!)
    - qwen3-coder-local          # Latest Qwen coder (32K context)
    - qwen2.5-coder-local        # Qwen 2.5 coder (32K context)
    - deepseek-coder-local       # DeepSeek coder (16K context)
    - codestral-local            # Codestral (32K context)
    - llama-3.1-70B-cloud        # Cloud fallback
    - llama-3.1-8B-cloud

  business:
    - qwen3-next-80b-local       # 🏆 Flagship 80B model (best!)
    - llama3.2-local             # Latest Llama (128K context!)
    - llama3.1-local             # Llama 3.1 (128K context)
    - wizardlm2-local            # WizardLM2 (32K context)
    - llama-3.1-70B-cloud        # Cloud fallback
    - llama-3.1-8B-cloud

  reasoning:
    - llama-3.3-nemotron-70b-local   # 🚀 NEW! Meta Llama 3.3 70B + NVIDIA (128K!)
    - qwen3-next-80b-local           # 🏆 Qwen3 Next 80B (32K context)
    - llama3.2-local                 # Latest Llama (128K context!)
    - llama3.1-local                 # Llama 3.1 (128K context)
    - nemotron-local                 # NVIDIA Nemotron (32K context)
    - wizardlm2-local                # WizardLM2 (32K context)
    - llama-3.1-70B-cloud            # Cloud fallback
    - llama-3.1-8B-cloud

  fast:
    - mistral-nemo-local         # Mistral Nemo (128K context!)
    - mistral-local              # Mistral (32K context)
    - llama-3.1-8B-cloud         # Cloud fallback
    - llama-3.1-70B-cloud

  vision:
    - nv-clip
    - clip-local

  voice_input:
    - whisper

  voice_output:
    - piper-tts

# Default Model Selection (Local-first - Latest flagships!)
defaults:
  llm: llama-3.3-nemotron-70b-local  # 🚀 Meta Llama 3.3 70B + NVIDIA (128K)
  code: qwen3-next-80b-local         # 🏆 Qwen3 Next 80B (best for code)
  reasoning: llama-3.3-nemotron-70b-local  # 🚀 Meta+NVIDIA 70B (128K)
  fast: mistral-nemo-local           # Fast local model (128K context)
  vision: nv-clip
  voice_input: whisper
  voice_output: piper-tts
  ocr: paddleocr
  embedding: nv-clip

# Performance Settings
performance:
  batch_size: 1
  concurrent_requests: 4
  timeout: 300
  retry_attempts: 3
  cache_enabled: true
  cache_ttl: 3600

# Logging
logging:
  level: INFO
  file: logs/models.log
  format: "[%(asctime)s] %(levelname)s - %(message)s"
